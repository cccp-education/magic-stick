name: Build ISO

# GBL-013-10 — the ISO build is expensive (~28 min). It is NEVER triggered by a
# plain push: it requires an explicit flag (see the `if` of the `build` job).
#   * release tag `vX.Y.Z`  → always builds (release path: checksum, SourceForge);
#   * workflow_dispatch     → only with `build_iso: true`;
#   * workflow_call         → only with `build_iso: true` (default true: an
#                             explicit caller is an intent);
#   * push on `main`        → only with the `[build-iso]` marker in the commit
#                             message, or the repository variable
#                             `MAGIC_STICK_BUILD_ISO = true`.
# Other pushes and pull requests skip the job (the run stays green).
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      build_iso:
        description: 'Build the ISO (expensive, ~28 min)'
        type: boolean
        default: false
  workflow_call:
    inputs:
      build_iso:
        description: 'Build the ISO (expensive, ~28 min)'
        type: boolean
        default: true

jobs:
  build:
    runs-on: ubuntu-latest
    if: >-
      ${{
        startsWith(github.ref, 'refs/tags/v') ||
        (github.event_name == 'workflow_dispatch' && inputs.build_iso) ||
        (github.event_name == 'workflow_call' && inputs.build_iso) ||
        (github.event_name == 'push' && (vars.MAGIC_STICK_BUILD_ISO == 'true' || contains(github.event.head_commit.message, '[build-iso]')))
      }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Verify Gradle wrapper version
        uses: cccp-education/conventions-gradle/.github/actions/verify-gradle-wrapper@main
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo apt-get clean
          df -h /

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Restore live-build cache (packages + downloads)
        uses: actions/cache@v6
        with:
          path: |
            build/cache
          key: lb-cache-v2-${{ runner.os }}-${{ hashFiles('config/live-build/package-lists/**', 'VERSION', 'scripts/lib/versions.sh') }}
          restore-keys: |
            lb-cache-v2-${{ runner.os }}-

      - name: Build Docker builder image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          load: true
          tags: magic-stick:builder

      - name: Build ISO
        run: ./gradlew isoBuild

      - name: Fix build directory permissions after Docker
        run: sudo chown -R "$(id -u):$(id -g)" build/

      - name: Verify ISO
        run: ./gradlew isoVerify

      - name: Test boot
        run: ./gradlew isoTestBoot

      - name: Test software in ISO
        run: ./gradlew isoTestSoftware

      - name: Smoke test (QEMU runtime)
        continue-on-error: true
        run: ./gradlew isoTestSmoke

      - name: Test A/B partition setup
        # SKIP: Les runners GitHub Actions ne sont pas privileged (loop devices interdits).
        # Le test isoTestAB complet necessite un runner self-hosted avec Docker --privileged.
        # Voir .agents/AB_PARTITION_REFERENCE.adoc -- CI/CD Limitations.
        # Executer localement: ./gradlew isoTestAB
        if: false
        run: ./gradlew isoTestAB

      - name: Mock test A/B + persistence (non-privileged CI/CD)
        # MEM-CI-GATE-2.1 (S-339) — errexit: without it the two `bash -n` syntax
        # checks could not fail the job (only the LAST command decides). The
        # `gradle tasks` probe is redirected to a file: a `gradle … | grep -q`
        # pipe would SIGPIPE gradle (141) and `pipefail` would fail a healthy run.
        run: |
          set -euo pipefail
          bash -n scripts/test-ab-partition.sh
          bash -n scripts/update-system.sh
          ./gradlew tasks --all --console=plain > "$RUNNER_TEMP/tasks.txt"
          grep -q isoTestAB "$RUNNER_TEMP/tasks.txt"
          echo "  task isoTestAB present"
          bash scripts/test-persistence-mock.sh scripts/update-system.sh

      - name: Get version from VERSION file
        id: version
        run: echo "version=$(head -n 1 VERSION | tr -d '[:space:]')" >> "$GITHUB_OUTPUT"

      - name: Set version environment
        run: echo "MAGIC_STICK_VERSION=${{ steps.version.outputs.version }}" >> "$GITHUB_ENV"

      - name: Generate ISO checksum
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          cd build
          ISO_NAME="magic-stick_${{ env.MAGIC_STICK_VERSION }}.iso"
          sha256sum "${ISO_NAME}" > "${ISO_NAME}.sha256"
          cat "${ISO_NAME}.sha256"

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v7
        if: success() || !startsWith(github.ref, 'refs/heads/main')
        with:
          name: magic-stick_iso
          path: build/magic-stick_${{ env.MAGIC_STICK_VERSION }}.iso*
          retention-days: 30

      - name: Deploy ISO to SourceForge
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          SF_SSH_KEY: ${{ secrets.SF_SSH_KEY }}
          SF_USERNAME: ${{ secrets.SF_USERNAME }}
          SF_KNOWN_HOSTS: ${{ secrets.SF_KNOWN_HOSTS }}
          MAGIC_STICK_VERSION: ${{ env.MAGIC_STICK_VERSION }}
        run: |
          mkdir -p ~/.ssh
          echo "$SF_SSH_KEY" | base64 -d > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          echo "$SF_KNOWN_HOSTS" > ~/.ssh/known_hosts
          ISO_NAME="magic-stick_${MAGIC_STICK_VERSION}.iso"
          SHA_FILE="${ISO_NAME}.sha256"
          ssh ${SF_USERNAME}@frs.sourceforge.net "mkdir -p /home/frs/project/magic-stick/magic-stick/" || true
          rsync -avz --progress \
            "build/${ISO_NAME}" \
            "build/${SHA_FILE}" \
            ${SF_USERNAME}@frs.sourceforge.net:/home/frs/project/magic-stick/magic-stick/

  docker-hub:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Get version from VERSION file
        id: version
        run: echo "version=$(head -n 1 VERSION | tr -d '[:space:]')" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./docker/magic-stick-cli/Dockerfile
          push: true
          tags: |
            cccpeducation/magic-stick-cli:${{ steps.version.outputs.version }}
            cccpeducation/magic-stick-cli:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test Docker image
        run: |
          docker run --rm "cccpeducation/magic-stick-cli:${{ steps.version.outputs.version }}" bash -c "
            set -e
            ollama --version
            python3 --version
            uv --version
            xh --version
            java -version 2>\u00261
          "